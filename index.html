<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco-Barrio San Francisco</title>
<style>
:root{--mint:#b9fde4;--violet:#7c4dff;--ink:#14102b;--red:#e21b3c;--green:#26890c}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--mint);color:var(--ink);display:flex;justify-content:center}
main{width:100%;max-width:900px;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(1.5rem,5vw,2.4rem);margin:0;text-transform:uppercase;line-height:1}
.stats{display:flex;gap:16px;align-items:center;font-weight:bold}
.meter{width:160px;height:16px;background:#fff;border-radius:9px;overflow:hidden;border:2px solid var(--ink)}
.meter i{display:block;height:100%;width:0;background:var(--green);transition:width .8s}
#scene{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--violet);background:#fff}
svg{display:block;width:100%;height:auto}
svg text{user-select:none}
#smog{transition:opacity 2s}.air-ok #smog{opacity:0}
.exhaust{animation:puff 2s ease-in-out infinite}.air-ok .exhaust{display:none}
.noise text{font-weight:900;fill:#e21b3c;font-family:Arial Black,sans-serif;animation:wob .5s ease-in-out infinite alternate}
.noise-ok .noise{display:none}
.car,.walker{animation:drive linear infinite}
.traffic-ok .extra{display:none}
.walker{opacity:0;transition:opacity 1s}.traffic-ok .walker{opacity:1}
.tree{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.2);transition:all 1.2s}
.trees-ok .tree{opacity:1;transform:scale(1)}.trees-ok .bare{opacity:0}
.bare{transition:opacity 1s}
.trash{transition:opacity 1s}.waste-ok .trash{opacity:0}
.bins{opacity:0;transition:opacity 1.2s}.waste-ok .bins{opacity:1}
.rainbow{opacity:0;transition:opacity 2s}.all-ok .rainbow{opacity:1}
.hot{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--red);color:#fff;font:900 1.4rem Arial,sans-serif;cursor:pointer;animation:pulse 1.4s infinite}
.hot.done{background:var(--green);animation:none;cursor:default}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#panel{background:#fff;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 6px 0 var(--violet)}
#panel h2{margin:0 0 8px;font-size:1.5rem}
#panel p{font-size:1.1rem;line-height:1.45;margin:0 0 12px}
.choices,.bins-row{display:grid;gap:10px;margin-bottom:10px}
.choices{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.bins-row{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
button.choice,button.binb,button.go{font:inherit;font-weight:bold;cursor:pointer;border-radius:12px;border:3px solid var(--ink);padding:14px;background:#f4efff}
button.choice:hover{background:var(--mint)}
button.choice.bad{background:#ffd9df;border-color:var(--red);opacity:.6}
button.go{background:var(--violet);color:#fff;border-color:#4a2bb0;font-size:1.1rem;padding:12px 26px}
.binb{color:#fff;font-size:1.1rem}
.item{font-size:4rem;text-align:center;margin:0}
.note{color:var(--red);font-weight:bold;min-height:1.4em}
.stars{font-size:3rem;letter-spacing:6px}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(-930px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,27,60,.7)}100%{box-shadow:0 0 0 18px rgba(226,27,60,0)}}
@keyframes puff{50%{opacity:.3;transform:translateY(-6px)}}
@keyframes wob{to{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Eco-Barrio San Francisco</h1>
  <div class="stats">
    <span>Community health</span>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="meter"><i id="fill"></i></div>
    <span id="mist">Mistakes: 0</span>
  </div>
</header>

<div id="scene">
<svg id="svg" viewBox="0 0 800 450" role="img" aria-label="Cartoon street of the San Francisco neighborhood with five problems">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e8fbff"/></linearGradient>
  <pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="11" height="13" rx="2" fill="#fff3b0"/></pattern>
</defs>
<rect width="800" height="450" fill="url(#sky)"/>
<path d="M0 230 L90 130 L180 200 L290 110 L400 210 L520 120 L640 205 L720 140 L800 210 V340 H0Z" fill="#5cc49a"/>
<text class="rainbow" x="400" y="105" font-size="90" text-anchor="middle">🌈</text>
<g>
  <rect x="30" y="170" width="120" height="175" fill="#f4a261"/><rect x="30" y="170" width="120" height="175" fill="url(#win)"/>
  <rect x="170" y="200" width="100" height="145" fill="#e76f51"/><rect x="170" y="200" width="100" height="145" fill="url(#win)"/>
  <rect x="290" y="150" width="130" height="195" fill="#9d8df1"/><rect x="290" y="150" width="130" height="195" fill="url(#win)"/>
  <rect x="440" y="190" width="110" height="155" fill="#f9c74f"/><rect x="440" y="190" width="110" height="155" fill="url(#win)"/>
  <rect x="570" y="160" width="120" height="185" fill="#43aa8b"/><rect x="570" y="160" width="120" height="185" fill="url(#win)"/>
  <rect x="705" y="205" width="80" height="140" fill="#90a4ae"/><rect x="705" y="205" width="80" height="140" fill="url(#win)"/>
</g>
<rect y="335" width="800" height="14" fill="#7bd88f"/>
<g>
  <ellipse class="bare" cx="100" cy="338" rx="24" ry="7" fill="#a1745a"/><ellipse class="bare" cx="285" cy="338" rx="24" ry="7" fill="#a1745a"/>
  <ellipse class="bare" cx="505" cy="338" rx="24" ry="7" fill="#a1745a"/><ellipse class="bare" cx="700" cy="338" rx="24" ry="7" fill="#a1745a"/>
  <text class="tree" x="76" y="340" font-size="54">🌳</text><text class="tree" x="261" y="340" font-size="54">🌳</text>
  <text class="tree" x="481" y="340" font-size="54">🌳</text><text class="tree" x="676" y="340" font-size="54">🌳</text>
  <text class="tree" x="190" y="342" font-size="26">🌻</text><text class="tree" x="395" y="342" font-size="26">🌻</text><text class="tree" x="600" y="342" font-size="26">🌻</text>
</g>
<rect y="349" width="800" height="62" fill="#4a4a55"/>
<line x1="0" y1="380" x2="800" y2="380" stroke="#fff" stroke-width="3" stroke-dasharray="24 18"/>
<rect y="411" width="800" height="39" fill="#d9d4c7"/>
<g>
  <text class="car" x="860" y="372" font-size="34" style="animation-duration:24s;animation-delay:-2s">🚗</text>
  <text class="car" x="860" y="372" font-size="34" style="animation-duration:24s;animation-delay:-9s">🚌</text>
  <text class="car extra" x="860" y="372" font-size="34" style="animation-duration:24s;animation-delay:-14s">🚕</text>
  <text class="car" x="860" y="404" font-size="34" style="animation-duration:20s;animation-delay:-5s">🚙</text>
  <text class="car extra" x="860" y="404" font-size="34" style="animation-duration:20s;animation-delay:-11s">🚗</text>
  <text class="car extra" x="860" y="404" font-size="34" style="animation-duration:20s;animation-delay:-17s">🚕</text>
</g>
<g class="exhaust"><text x="130" y="358" font-size="22">💨</text><text x="420" y="358" font-size="22">💨</text><text x="650" y="358" font-size="22">💨</text></g>
<g class="noise"><text x="170" y="330" font-size="18">BEEP!</text><text x="400" y="326" font-size="18">HONK!</text><text x="610" y="330" font-size="18">BEEP BEEP!</text></g>
<text class="walker" x="860" y="436" font-size="26" style="animation-duration:18s;animation-delay:-4s">🚲</text>
<text class="walker" x="860" y="436" font-size="26" style="animation-duration:30s;animation-delay:-12s">🚶</text>
<g class="trash" font-size="22"><text x="60" y="442">🥤</text><text x="130" y="440">🍌</text><text x="300" y="442">📦</text><text x="470" y="440">📰</text><text x="640" y="442">🛍️</text><text x="720" y="440">🍎</text></g>
<g class="bins" font-size="28"><text x="90" y="442">♻️</text><text x="420" y="442">♻️</text><text x="700" y="442">♻️</text></g>
<rect id="smog" width="800" height="450" fill="#6b6470" opacity=".5" pointer-events="none"/>
</svg>
<button class="hot" data-k="air" style="left:50%;top:18%" aria-label="Problem: air pollution">!</button>
<button class="hot" data-k="noise" style="left:25%;top:66%" aria-label="Problem: noise pollution">!</button>
<button class="hot" data-k="traffic" style="left:78%;top:80%" aria-label="Problem: too much traffic">!</button>
<button class="hot" data-k="trees" style="left:50%;top:73%" aria-label="Problem: lack of trees and green areas">!</button>
<button class="hot" data-k="waste" style="left:12%;top:94%" aria-label="Problem: poor waste management">!</button>
</div>

<section id="panel" aria-live="polite"></section>
</main>

<script>
const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const P={
air:{t:"🌫️ Air pollution caused by transportation",d:"A gray smog from exhaust fumes is covering the neighborhood. What should we do?",o:[
 ["Encourage public transportation and car sharing",1,"Fewer cars on the road means cleaner air for everyone."],
 ["Promote cycling and walking",1,"Trips without engines produce zero pollution."],
 ["Everyone should drive alone to be more comfortable",0,"More cars means more smog. Try sharing rides instead."]]},
noise:{t:"📢 Noise pollution",d:"Horns echo all day long and nobody can rest. What is the best action?",o:[
 ["Reduce unnecessary use of car horns",1,"Quieter streets, healthier neighbors."],
 ["Promote respect for quiet hours",1,"Shared rules help the whole community rest."],
 ["Play louder music so nobody hears the horns",0,"That only adds more noise!"]]},
traffic:{t:"🚦 Too much traffic",d:"The street is packed with cars. How can we move better?",o:[
 ["Promote bicycle use",1,"Bikes take less space and don't pollute."],
 ["Improve pedestrian spaces and encourage walking",1,"Safe sidewalks invite people to walk."],
 ["Build a bigger highway through the neighborhood",0,"More roads attract even more cars."]]},
trees:{t:"🌱 Lack of trees and green areas",d:"The ground is bare and the neighborhood needs shade. What can we do?",o:[
 ["Plant more trees and protect the existing ones",1,"Trees give shade, clean the air and reduce noise."],
 ["Create community gardens",1,"Gardens bring neighbors together and add green space."],
 ["Cut the old trees to build parking",0,"We need to protect trees, not remove them."]]},
};
const BINS=[["plastic","Plastic","#e21b3c"],["paper","Paper","#1368ce"],["cardboard","Cardboard","#b86a1e"],["organic","Organic","#26890c"]];
const ITEMS=[["🥤","plastic bottle","plastic"],["📰","old newspaper","paper"],["📦","cardboard box","cardboard"],["🍌","banana peel","organic"],["🛍️","plastic bag","plastic"]];
const WIN="Sustainability is everyone's responsibility. A better community starts with us!";
const fixed=new Set();let mistakes=0;
const panel=$("panel"),svg=$("svg");

function upd(){
  const v=fixed.size*20;$("fill").style.width=v+"%";$("meter").setAttribute("aria-valuenow",v);
  $("mist").textContent="Mistakes: "+mistakes;
}
function intro(){
  panel.innerHTML="";
  panel.append(h("h2","","Welcome, eco-hero! 🌎"),h("p","","Five problems are hurting our community. Tap each pulsing red ! on the map and choose the best action to fix it."));
}
function fix(k,msg){
  fixed.add(k);svg.classList.add(k+"-ok");
  const b=document.querySelector('.hot[data-k="'+k+'"]');b.classList.add("done");b.textContent="✓";
  upd();panel.innerHTML="";
  if(fixed.size===5)return finish(msg);
  panel.append(h("h2","","✅ Problem solved!"),h("p","",msg),h("p","",(5-fixed.size)+" left. Find the next pulsing ! on the map."));
}
function open(k){
  if(fixed.has(k))return;
  if(k==="waste")return sort(0);
  const p=P[k],note=h("p","note","");
  panel.innerHTML="";
  panel.append(h("h2","",p.t),h("p","",p.d));
  const box=h("div","choices");
  p.o.forEach(([txt,ok,why])=>{
    const b=h("button","choice",txt);
    b.onclick=()=>{if(ok)fix(k,why);else{mistakes++;upd();b.disabled=true;b.classList.add("bad");note.textContent="Not that one. "+why}};
    box.append(b);
  });
  panel.append(box,note);
}
function sort(n){
  panel.innerHTML="";
  if(n>=ITEMS.length)return fix("waste","Recycling stations and separating plastic, paper, cardboard and organic waste keep our streets clean.");
  const it=ITEMS[n],note=h("p","note","");
  panel.append(h("h2","","♻️ Poor waste management"),h("p","","Sort the trash ("+(n+1)+" of "+ITEMS.length+"): where does this go?"),h("p","item",it[0]),h("p","", "A "+it[1]));
  const row=h("div","bins-row");
  BINS.forEach(([id,name,col])=>{
    const b=h("button","binb",name);b.style.background=col;
    b.onclick=()=>{if(id===it[2])sort(n+1);else{mistakes++;upd();note.textContent="Oops, a "+it[1]+" doesn't go in "+name+". Try again!"}};
    row.append(b);
  });
  panel.append(row,note);
}
function finish(msg){
  svg.classList.add("all-ok");
  const s=mistakes===0?3:mistakes<=3?2:1;
  panel.append(h("h2","","🎉 You saved San Francisco!"),h("p","stars","⭐".repeat(s)+"☆".repeat(3-s)),
    h("p","",msg),h("p","","You made "+mistakes+" mistake"+(mistakes===1?"":"s")+". "+WIN));
  const b=h("button","go","Play again");b.onclick=()=>location.reload();panel.append(b);
}
document.querySelectorAll(".hot").forEach(b=>b.onclick=()=>open(b.dataset.k));
upd();intro();
</script>
</body>
</html>
