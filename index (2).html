<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco-Barrio San Francisco</title>
<style>
:root{--mint:#b9fde4;--violet:#7c4dff;--ink:#14102b;--red:#e21b3c;--green:#26890c;--gap:clamp(14px,4vw,28px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--mint);color:var(--ink);overflow-x:hidden}
main{max-width:900px;margin:0 auto;padding:max(var(--gap),env(safe-area-inset-top)) max(var(--gap),env(safe-area-inset-right)) max(var(--gap),env(safe-area-inset-bottom)) max(var(--gap),env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(1.4rem,6vw,2.4rem);margin:0;text-transform:uppercase;line-height:1.05}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-weight:bold;font-size:.95rem}
.meter{width:140px;max-width:100%;height:16px;background:#fff;border-radius:9px;overflow:hidden;border:2px solid var(--ink)}
.meter i{display:block;height:100%;width:0;background:var(--green);transition:width .8s}
#scene{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 5px 0 var(--violet);background:#fff}
svg{display:block;width:100%;height:auto}
.air-ok #smog{opacity:0}#smog{transition:opacity 2s}
.exhaust{animation:puff 2s ease-in-out infinite}.air-ok .exhaust{display:none}
.noise text{font-weight:900;fill:var(--red);font-family:"Arial Black",sans-serif;animation:wob .5s ease-in-out infinite alternate}
.noise-ok .noise{display:none}
.car,.walker{animation:drive linear infinite}
.traffic-ok .extra{display:none}
.walker{opacity:0;transition:opacity 1s}.traffic-ok .walker{opacity:1}
.tree{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.2);transition:all 1.2s}
.trees-ok .tree{opacity:1;transform:scale(1)}.trees-ok .bare{opacity:0}.bare{transition:opacity 1s}
.trash{transition:opacity 1s}.waste-ok .trash{opacity:0}
.bins{opacity:0;transition:opacity 1.2s}.waste-ok .bins{opacity:1}
.rainbow{opacity:0;transition:opacity 2s}.all-ok .rainbow{opacity:1}
.hot{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:var(--red);color:#fff;font:900 1.3rem Arial,sans-serif;cursor:pointer;padding:0;animation:pulse 1.4s infinite}
.hot.done{background:var(--green);animation:none;cursor:default}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#panel{background:#fff;border-radius:16px;padding:clamp(16px,4vw,24px);margin-top:20px;box-shadow:0 5px 0 var(--violet)}
#panel h2{margin:0 0 8px;font-size:clamp(1.2rem,4.5vw,1.5rem)}
#panel p{font-size:1.05rem;line-height:1.45;margin:0 0 12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-bottom:10px}
.bins-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
button.choice,button.binb,button.go{font:inherit;font-weight:bold;cursor:pointer;border-radius:12px;border:3px solid var(--ink);padding:14px;background:#f4efff;color:var(--ink);min-height:48px}
button.choice:hover{background:var(--mint)}
button.choice.bad{background:#ffd9df;border-color:var(--red);opacity:.6}
button.go{background:var(--violet);color:#fff;border-color:#4a2bb0;font-size:1.1rem;padding:12px 26px}
button.binb{color:#fff;border-color:transparent;font-size:1.05rem}
.item{display:flex;justify-content:center;margin:0 0 6px}
.item svg{width:84px;height:84px}
.note{color:var(--red);font-weight:bold;min-height:1.4em}
.stars{display:flex;gap:6px}.stars svg{width:44px;height:44px}
.hot svg{display:block;margin:auto}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(-960px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,27,60,.7)}100%{box-shadow:0 0 0 14px rgba(226,27,60,0)}}
@keyframes puff{50%{opacity:.3;transform:translateY(-6px)}}
@keyframes wob{to{transform:translateY(-5px)}}
@media(min-width:620px){.bins-row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:480px){.hot{width:38px;height:38px;font-size:1.1rem}.meter{width:110px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Eco-Barrio San Francisco</h1>
  <div class="stats">
    <span>Community health</span>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="fill"></i></div>
    <span id="mist">Mistakes: 0</span>
  </div>
</header>

<div id="scene">
<svg id="svg" viewBox="0 0 800 450" role="img" aria-label="Illustrated street of the San Francisco neighborhood with five problems to solve">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e8fbff"/></linearGradient>
  <pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="11" height="13" rx="2" fill="#fff3b0"/></pattern>
  <symbol id="car" viewBox="0 0 60 30"><path d="M3 22 L7 13 Q9 8 15 8 H37 Q43 8 47 14 L55 17 Q58 18 58 23 V25 H3Z" fill="currentColor"/><path d="M13 11 H24 V17 H10Z M27 11 H37 L42 17 H27Z" fill="#d7f1ff"/><circle cx="16" cy="25" r="5" fill="#222"/><circle cx="46" cy="25" r="5" fill="#222"/></symbol>
  <symbol id="bus" viewBox="0 0 90 34"><rect x="2" y="2" width="86" height="26" rx="5" fill="currentColor"/><g fill="#d7f1ff"><rect x="8" y="7" width="14" height="10"/><rect x="26" y="7" width="14" height="10"/><rect x="44" y="7" width="14" height="10"/><rect x="62" y="7" width="20" height="10"/></g><circle cx="22" cy="29" r="5" fill="#222"/><circle cx="68" cy="29" r="5" fill="#222"/></symbol>
  <symbol id="tree" viewBox="0 0 50 70"><rect x="22" y="40" width="6" height="30" fill="#7a4b2a"/><circle cx="25" cy="24" r="20" fill="#2e9b4f"/><circle cx="14" cy="32" r="12" fill="#3cb35f"/><circle cx="36" cy="30" r="13" fill="#3cb35f"/></symbol>
  <symbol id="flower" viewBox="0 0 20 30"><rect x="9" y="12" width="2" height="18" fill="#2e9b4f"/><circle cx="10" cy="8" r="6" fill="#f6c026"/><circle cx="10" cy="8" r="2.5" fill="#8a4b12"/></symbol>
  <symbol id="puff" viewBox="0 0 40 24"><g fill="#7d7885" opacity=".85"><circle cx="10" cy="14" r="8"/><circle cx="22" cy="10" r="10"/><circle cx="32" cy="15" r="7"/></g></symbol>
  <symbol id="bike" viewBox="0 0 40 28"><g fill="none" stroke="#222" stroke-width="2"><circle cx="8" cy="20" r="7"/><circle cx="32" cy="20" r="7"/><path d="M8 20 L17 9 H27 L32 20 M17 9 L21 20 H8 M27 9 L25 4"/></g><circle cx="20" cy="2" r="2.5" fill="#f1c27d"/></symbol>
  <symbol id="walk" viewBox="0 0 20 40"><circle cx="10" cy="6" r="5" fill="#f1c27d"/><path d="M10 11 V26 M10 15 L4 22 M10 15 L16 22 M10 26 L5 38 M10 26 L15 38" stroke="#2b2b5a" stroke-width="3" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="bin" viewBox="0 0 30 36"><rect x="2" y="6" width="26" height="4" rx="1" fill="#14102b"/><path d="M5 10 H25 L23 34 H7Z" fill="currentColor"/><path d="M11 16 H19 M11 22 H19 M11 28 H19" stroke="#fff" stroke-width="2" opacity=".6"/></symbol>
  <symbol id="i-plastic" viewBox="0 0 40 40"><rect x="15" y="3" width="10" height="6" rx="1" fill="#4aa8e8"/><rect x="11" y="9" width="18" height="28" rx="5" fill="#7ac7ff"/><rect x="11" y="18" width="18" height="8" fill="#fff" opacity=".7"/></symbol>
  <symbol id="i-paper" viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="30" fill="#f4f4f4" stroke="#888"/><path d="M10 12 H30 M10 18 H20 M10 24 H20 M24 18 H30 V28 H24Z M10 30 H30" stroke="#777" stroke-width="2" fill="none"/></symbol>
  <symbol id="i-cardboard" viewBox="0 0 40 40"><rect x="5" y="11" width="30" height="24" fill="#c8924f"/><rect x="5" y="11" width="30" height="7" fill="#b07d3d"/><rect x="16" y="11" width="8" height="11" fill="#e6c58f"/></symbol>
  <symbol id="i-organic" viewBox="0 0 40 40"><path d="M6 12 Q20 40 35 13 Q22 28 6 12Z" fill="#f4d03f" stroke="#a88a00" stroke-width="2"/><path d="M6 12 L4 8" stroke="#6b5a00" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-bag" viewBox="0 0 40 40"><path d="M9 14 H31 L34 37 H6Z" fill="#ececec" stroke="#999" stroke-width="2"/><path d="M14 14 Q14 5 20 5 Q26 5 26 14" fill="none" stroke="#999" stroke-width="2"/></symbol>
</defs>
<rect width="800" height="450" fill="url(#sky)"/>
<path d="M0 230 L90 130 L180 200 L290 110 L400 210 L520 120 L640 205 L720 140 L800 210 V340 H0Z" fill="#5cc49a"/>
<text class="rainbow" x="400" y="105" font-size="90" text-anchor="middle">🌈</text>
<g>
  <rect x="30" y="170" width="120" height="175" fill="#f4a261"/><rect x="30" y="170" width="120" height="175" fill="url(#win)"/>
  <rect x="170" y="200" width="100" height="145" fill="#e76f51"/><rect x="170" y="200" width="100" height="145" fill="url(#win)"/>
  <rect x="290" y="150" width="130" height="195" fill="#9d8df1"/><rect x="290" y="150" width="130" height="195" fill="url(#win)"/>
  <rect x="440" y="190" width="110" height="155" fill="#f9c74f"/><rect x="440" y="190" width="110" height="155" fill="url(#win)"/>
  <rect x="570" y="160" width="120" height="175" fill="#43aa8b"/><rect x="570" y="160" width="120" height="185" fill="url(#win)"/>
  <rect x="705" y="205" width="80" height="140" fill="#90a4ae"/><rect x="705" y="205" width="80" height="140" fill="url(#win)"/>
</g>
<rect y="335" width="800" height="14" fill="#7bd88f"/>
<g>
  <ellipse class="bare" cx="100" cy="340" rx="24" ry="7" fill="#a1745a"/><ellipse class="bare" cx="285" cy="340" rx="24" ry="7" fill="#a1745a"/>
  <ellipse class="bare" cx="505" cy="340" rx="24" ry="7" fill="#a1745a"/><ellipse class="bare" cx="700" cy="340" rx="24" ry="7" fill="#a1745a"/>
  <text class="tree" x="76" y="340" font-size="54">🌳</text><text class="tree" x="261" y="340" font-size="54">🌳</text>
  <text class="tree" x="481" y="340" font-size="54">🌳</text><text class="tree" x="676" y="340" font-size="54">🌳</text>
  <text class="tree" x="190" y="342" font-size="26">🌻</text><text class="tree" x="395" y="342" font-size="26">🌻</text><text class="tree" x="600" y="342" font-size="26">🌻</text>
</g>
<rect y="349" width="800" height="62" fill="#4a4a55"/>
<line x1="0" y1="380" x2="800" y2="380" stroke="#fff" stroke-width="3" stroke-dasharray="24 18"/>
<rect y="411" width="800" height="39" fill="#d9d4c7"/>
<g>
  <text class="car" x="860" y="372" font-size="34" style="animation-duration:24s;animation-delay:-2s">🚗</text>
  <text class="car" x="860" y="372" font-size="34" style="animation-duration:24s;animation-delay:-9s">🚌</text>
  <text class="car extra" x="860" y="372" font-size="34" style="animation-duration:24s;animation-delay:-16s">🚕</text>
  <text class="car" x="860" y="404" font-size="34" style="animation-duration:20s;animation-delay:-5s">🚙</text>
  <text class="car extra" x="860" y="404" font-size="34" style="animation-duration:20s;animation-delay:-11s">🚗</text>
  <text class="car extra" x="860" y="404" font-size="34" style="animation-duration:20s;animation-delay:-17s">🚕</text>
</g>
<g class="exhaust"><text x="110" y="346" font-size="22">💨</text><text x="420" y="346" font-size="22">💨</text><text x="650" y="346" font-size="22">💨</text></g>
<g class="noise" font-size="18"><text x="170" y="326">BEEP!</text><text x="400" y="322">HONK!</text><text x="610" y="326">BEEP BEEP!</text></g>
<text class="walker" x="860" y="436" font-size="26" style="animation-duration:18s;animation-delay:-4s">🚲</text>
<text class="walker" x="860" y="436" font-size="26" style="animation-duration:30s;animation-delay:-12s">🚶</text>
<g class="trash" font-size="24"><text x="60" y="440">🥤</text><text x="130" y="440">🍌</text><text x="300" y="440">📦</text><text x="470" y="440">📰</text><text x="640" y="440">🛍️</text><text x="720" y="440">🍎</text></g>
<g class="bins" font-size="28"><text x="90" y="442">♻️</text><text x="420" y="442">♻️</text><text x="700" y="442">♻️</text></g>
<rect id="smog" width="800" height="450" fill="#6b6470" opacity=".5" pointer-events="none"/>
</svg>
<button class="hot" data-k="air" style="left:50%;top:17%" aria-label="Problem: air pollution">!</button>
<button class="hot" data-k="noise" style="left:25%;top:66%" aria-label="Problem: noise pollution">!</button>
<button class="hot" data-k="traffic" style="left:80%;top:76%" aria-label="Problem: too much traffic">!</button>
<button class="hot" data-k="trees" style="left:50%;top:70%" aria-label="Problem: lack of trees and green areas">!</button>
<button class="hot" data-k="waste" style="left:15%;top:88%" aria-label="Problem: poor waste management">!</button>
</div>

<section id="panel" aria-live="polite"></section>
</main>

<script>
const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const icon=id=>{const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg"),u=document.createElementNS(NS,"use");s.setAttribute("viewBox","0 0 40 40");s.setAttribute("aria-hidden","true");u.setAttribute("href","#i-"+id);s.append(u);return s};
const P={
air:{t:"Air pollution caused by transportation",d:"A gray smog from exhaust fumes is covering the neighborhood. What should we do?",o:[
 ["Encourage public transportation and car sharing",1,"Fewer cars on the road means cleaner air for everyone."],
 ["Promote cycling and walking",1,"Trips without engines produce zero pollution."],
 ["Everyone should drive alone to be more comfortable",0,"More cars means more smog. Try sharing rides instead."]]},
noise:{t:"Noise pollution",d:"Horns echo all day long and nobody can rest. What is the best action?",o:[
 ["Reduce unnecessary use of car horns",1,"Quieter streets, healthier neighbors."],
 ["Promote respect for quiet hours",1,"Shared rules help the whole community rest."],
 ["Play louder music so nobody hears the horns",0,"That only adds more noise."]]},
traffic:{t:"Too much traffic",d:"The street is packed with cars. How can we move better?",o:[
 ["Promote bicycle use",1,"Bikes take less space and don't pollute."],
 ["Improve pedestrian spaces and encourage walking",1,"Safe sidewalks invite people to walk."],
 ["Build a bigger highway through the neighborhood",0,"More roads attract even more cars."]]},
trees:{t:"Lack of trees and green areas",d:"The ground is bare and the neighborhood needs shade. What can we do?",o:[
 ["Plant more trees and protect the existing ones",1,"Trees give shade, clean the air and reduce noise."],
 ["Create community gardens",1,"Gardens bring neighbors together and add green space."],
 ["Cut the old trees to build parking",0,"We need to protect trees, not remove them."]]},
};
const BINS=[["plastic","Plastic","#e21b3c"],["paper","Paper","#1368ce"],["cardboard","Cardboard","#a85d12"],["organic","Organic","#26890c"]];
const ITEMS=[["plastic","plastic bottle","plastic"],["paper","old newspaper","paper"],["cardboard","cardboard box","cardboard"],["organic","banana peel","organic"],["bag","plastic bag","plastic"]];
const WIN="Sustainability is everyone's responsibility. A better community starts with us!";
const fixed=new Set();let mistakes=0;
const panel=$("panel"),svg=$("svg");

function upd(){
  const v=fixed.size*20;$("fill").style.width=v+"%";$("meter").setAttribute("aria-valuenow",v);
  $("mist").textContent="Mistakes: "+mistakes;
}
function intro(){
  panel.innerHTML="";
  panel.append(h("h2","","Help our neighborhood"),h("p","","Five problems are hurting San Francisco. Tap each pulsing red ! on the map and choose the best action to fix it."));
}
function fix(k,msg){
  fixed.add(k);svg.classList.add(k+"-ok");
  const b=document.querySelector('.hot[data-k="'+k+'"]');b.classList.add("done");b.innerHTML='<svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><path d="M4 10.5 L8.5 15 L16 5.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';b.setAttribute("aria-label","Solved");b.disabled=true;
  upd();panel.innerHTML="";
  if(fixed.size===5)return finish(msg);
  panel.append(h("h2","","Problem solved"),h("p","",msg),h("p","",(5-fixed.size)+" left. Find the next pulsing ! on the map."));
}
function open(k){
  if(fixed.has(k))return;
  if(k==="waste")return sort(0);
  const p=P[k],note=h("p","note","");
  panel.innerHTML="";
  panel.append(h("h2","",p.t),h("p","",p.d));
  const box=h("div","choices");
  p.o.forEach(([txt,ok,why])=>{
    const b=h("button","choice",txt);
    b.onclick=()=>{if(ok)fix(k,why);else{mistakes++;upd();b.disabled=true;b.classList.add("bad");note.textContent="Not that one. "+why}};
    box.append(b);
  });
  panel.append(box,note);
}
function sort(n){
  panel.innerHTML="";
  if(n>=ITEMS.length)return fix("waste","Recycling stations and separating plastic, paper, cardboard and organic waste keep our streets clean.");
  const it=ITEMS[n],note=h("p","note",""),pic=h("div","item");pic.append(icon(it[0]));
  panel.append(h("h2","","Poor waste management"),h("p","","Sort the trash ("+(n+1)+" of "+ITEMS.length+"): where does the "+it[1]+" go?"),pic);
  const row=h("div","bins-row");
  BINS.forEach(([id,name,col])=>{
    const b=h("button","binb",name);b.style.background=col;
    b.onclick=()=>{if(id===it[2])sort(n+1);else{mistakes++;upd();note.textContent="A "+it[1]+" doesn't go in "+name+". Try again."}};
    row.append(b);
  });
  panel.append(row,note);
}
function finish(msg){
  svg.classList.add("all-ok");
  const s=mistakes===0?3:mistakes<=3?2:1,st=h("p","stars");
  const NS="http://www.w3.org/2000/svg";
  for(let i=0;i<3;i++){const sv=document.createElementNS(NS,"svg"),pl=document.createElementNS(NS,"polygon");sv.setAttribute("viewBox","0 0 24 24");sv.setAttribute("aria-hidden","true");pl.setAttribute("points","12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,18 5.5,22 7.5,14.5 2,9.5 9,9");pl.setAttribute("fill",i<s?"#e8a800":"#d6d0e6");sv.append(pl);st.append(sv)}
  st.setAttribute("aria-label",s+" out of 3 stars");
  panel.append(h("h2","","You saved San Francisco"),st,h("p","",msg),h("p","","You made "+mistakes+" mistake"+(mistakes===1?"":"s")+". "+WIN));
  const b=h("button","go","Play again");b.onclick=()=>location.reload();panel.append(b);
}
document.querySelectorAll(".hot").forEach(b=>b.onclick=()=>open(b.dataset.k));
upd();intro();
</script>
</body>
</html>
